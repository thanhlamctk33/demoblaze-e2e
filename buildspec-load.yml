version: 0.2

env:
  shell: bash
  variables:
    K6_VERSION: v1.1.0
    SCENARIO: smoke

phases:
  install:
    commands:
      - curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
      - mv /tmp/k6-${K6_VERSION}-linux-amd64/k6 /usr/local/bin/k6
      - k6 version
  build:
    commands:
      - mkdir -p reports/k6
      - k6 run -e SCENARIO="$SCENARIO" --summary-export="reports/k6/checkout-${SCENARIO}.json" perf/k6/checkout-flow.js

artifacts:
  name: k6-$SCENARIO
  files:
    - reports/k6/**/*
